<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Track ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="@OUTLINE@" stroke-width="3.5"/>
  <!-- Moving arc, rotated by @ROT@ degrees each frame -->
  <path
    d="M16,6 A10,10 0 0 1 26,16"
    fill="none"
    stroke="@BODY@"
    stroke-width="3"
    stroke-linecap="round"
    transform="rotate(@ROT@, 16, 16)"/>
  <circle cx="16" cy="16" r="2.5" fill="@ACCENT@"/>
</svg>
