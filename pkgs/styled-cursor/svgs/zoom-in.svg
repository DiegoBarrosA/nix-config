<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Lens outline then body -->
  <circle cx="13" cy="13" r="9" fill="none" stroke="@OUTLINE@" stroke-width="4"/>
  <circle cx="13" cy="13" r="9" fill="@BODY@" fill-opacity="0.15"
    stroke="@BODY@" stroke-width="2.5"/>
  <!-- Handle outline then body -->
  <line x1="19.5" y1="19.5" x2="28" y2="28"
    stroke="@OUTLINE@" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="19.5" y1="19.5" x2="28" y2="28"
    stroke="@BODY@" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Plus -->
  <line x1="9"  y1="13" x2="17" y2="13" stroke="@ACCENT@" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="9"  x2="13" y2="17" stroke="@ACCENT@" stroke-width="2" stroke-linecap="round"/>
</svg>
