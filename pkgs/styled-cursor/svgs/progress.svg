<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Arrow (scaled down to leave room for spinner) -->
  <polygon
    points="4,4 4,21 8,17 10,24 14,22 12,15 18,15"
    fill="@BODY@"
    stroke="@OUTLINE@"
    stroke-width="1.5"
    stroke-linejoin="round"
    paint-order="stroke"/>
  <!-- Mini spinner at bottom-right -->
  <circle cx="24" cy="24" r="6" fill="@OUTLINE@" opacity="0.8"/>
  <circle cx="24" cy="24" r="4.5" fill="none" stroke="@BODY@" stroke-width="1.5"
    stroke-dasharray="10 18"/>
  <circle cx="24" cy="24" r="1.5" fill="@ACCENT@"/>
</svg>
