<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Draw outline stroke beneath fill using paint-order -->
  <polygon
    points="4,4 4,26 9,21 13,30 17,28 13,19 21,19"
    fill="@BODY@"
    stroke="@OUTLINE@"
    stroke-width="2"
    stroke-linejoin="round"
    paint-order="stroke"/>
  <circle cx="5" cy="5" r="1.5" fill="@ACCENT@"/>
</svg>
