name: Deploy cobalto

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Queue deploys, never cancel one mid-activation.
concurrency:
  group: deploy-cobalto
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Eval must match the Nix we develop with: older Nix rejects dotted and block definitions of one attr.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Private flake inputs are locked as ssh://git@github.com/..., and a deploy key covers one repo only.
      # One read-only token rewrites them all to HTTPS. The lock file stays unchanged.
      - name: Let git fetch private GitHub inputs
        env:
          GH_READ_TOKEN: ${{ secrets.GH_READ_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_READ_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"

      # cobalto runs Tailscale SSH: the tailnet ACL authenticates tag:ci, no SSH key for cobalto.
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # No separate `nix flake check --no-build`: the config reads a derivation output (hermes uv.lock),
      # so eval must build on a clean runner. deploy-rs runs its own flake check first.
      # --inputs-from keeps deploy-rs on the nixpkgs pinned in flake.lock.
      - run: >
          nix shell --inputs-from . nixpkgs#deploy-rs -c
          deploy .#cobalto --ssh-opts "-o StrictHostKeyChecking=accept-new"
